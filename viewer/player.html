<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body class="player">
<div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
<main id="stage" aria-live="polite"></main>
<nav class="dock" aria-label="Slide controls">
  <a class="icon ghost" href="../index.html" aria-label="All presentations"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></a>
  <button class="icon" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="dots" class="dots"></div>
  <span id="count" class="count"></span>
  <button class="icon ghost" id="overview-btn" aria-label="All slides"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
  <button class="icon ghost" id="theme-btn" aria-label="Switch theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" class="solid"/></svg></button>
  <button class="icon ghost hide-phone" id="full-btn" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="icon primary" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>
<div id="overview" class="overview" hidden>
  <div class="overview-head"><h2>All slides</h2><button id="overview-close" class="chip">Close</button></div>
  <div id="overview-grid" class="overview-grid"></div>
</div>
<script src="manifest.js"></script>
<script src="engine.js"></script>
<script src="player.js"></script>
</body>
</html>
