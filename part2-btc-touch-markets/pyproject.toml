[project]
name = "touchmkt"
version = "0.1.0"
description = "Polymarket BTC touch markets against Deribit options and Kalshi ladders"
requires-python = ">=3.12,<3.14"
dependencies = [
  "matplotlib==3.9.2",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.14.1",
]

[dependency-groups]
dev = ["pytest==8.3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchmkt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
